name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run already in flight pointless, and
# each one occupies six matrix jobs. Runs on main are not grouped away, so the
# history of the default branch stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The Downloads-folder resolution is the only platform-specific code
        # in the tool, and it only ever runs on Windows and macOS. One job
        # each, on the newest supported Python.
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # tests/requirements-dev.txt carries "-c constraints.txt", so this pins
      # yt-dlp to a known version. A red build then means this repository
      # broke, rather than YouTube having changed something overnight.
      # Dependabot bumps the pin weekly and that PR re-runs everything below.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt

      # Linting is platform-independent, so run it once rather than on every
      # matrix leg (ruff format in particular is sensitive to line endings).
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check .

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check .

      # Also platform-independent: the mypy config pins python_version and
      # platform itself, so the result does not depend on the matrix leg it
      # runs on. Running it once is enough.
      - name: Type check
        if: matrix.os == 'ubuntu-latest'
        run: mypy

      - name: Run tests
        run: pytest -q

      # The README tells people to `pip install .` and run `youtube-downloader`.
      # Nothing above exercises that: the tests import the module directly, so a
      # broken [project.scripts] entry point would ship green. --help is enough
      # to prove the script exists, resolves, and reaches argparse.
      - name: Check the installed console script
        run: |
          pip install .
          youtube-downloader --help

  # The one check branch protection requires, and the only one whose name is
  # stable. The matrix jobs are named "${{ matrix.os }} / Python <version>",
  # so requiring them directly would mean editing the ruleset every time the
  # matrix changes - and a required check that stops reporting blocks every
  # merge, permanently. This job's name never changes, so the ruleset never
  # has to.
  #
  # "needs: test" waits for every matrix leg; needs.test.result is "success"
  # only if all of them succeeded. "if: always()" is what makes the gate run
  # at all when a leg fails - without it this job would be skipped, and a
  # skipped required check never reports.
  ci:
    name: CI
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix job did not succeed
        if: needs.test.result != 'success'
        run: |
          echo "One or more matrix jobs reported '${{ needs.test.result }}'."
          exit 1
